// Every kind of field tools/gen writes, for tests/gen_test.zig. Perfetto's
// protos use only some of them, and none packed.

syntax = "proto2";

package utrace.test;

enum Top {
  TOP_NEGATIVE = -1;
  TOP_ZERO = 0;
  TOP_MAX = 2147483647;
}

message AllTypes {
  enum Inner {
    INNER_A = 1;
    INNER_B = 2;
  }

  message Nested {
    optional int32 x = 1;
    optional Nested deeper = 2;
  }

  optional double f_double = 1;
  optional float f_float = 2;
  optional int64 f_int64 = 3;
  optional uint64 f_uint64 = 4;
  optional int32 f_int32 = 5;
  optional fixed64 f_fixed64 = 6;
  optional fixed32 f_fixed32 = 7;
  optional bool f_bool = 8;
  optional string f_string = 9;
  optional bytes f_bytes = 12;
  optional uint32 f_uint32 = 13;
  optional Inner f_enum = 14;
  optional sfixed32 f_sfixed32 = 15;
  optional sfixed64 f_sfixed64 = 16;
  optional sint32 f_sint32 = 17;
  optional sint64 f_sint64 = 18;
  optional Top f_top = 19;
  optional Nested f_nested = 20;

  repeated int64 r_int64 = 30;
  repeated string r_string = 31;
  repeated Nested r_nested = 32;

  repeated double p_double = 40 [packed = true];
  repeated float p_float = 41 [packed = true];
  repeated int64 p_int64 = 42 [packed = true];
  repeated uint64 p_uint64 = 43 [packed = true];
  repeated int32 p_int32 = 44 [packed = true];
  repeated fixed64 p_fixed64 = 45 [packed = true];
  repeated fixed32 p_fixed32 = 46 [packed = true];
  repeated bool p_bool = 47 [packed = true];
  repeated uint32 p_uint32 = 48 [packed = true];
  repeated Inner p_enum = 49 [packed = true];
  repeated sfixed32 p_sfixed32 = 50 [packed = true];
  repeated sfixed64 p_sfixed64 = 51 [packed = true];
  repeated sint32 p_sint32 = 52 [packed = true];
  repeated sint64 p_sint64 = 53 [packed = true];

  optional uint32 f_highest = 536870911;
}
